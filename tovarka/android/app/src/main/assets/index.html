[hidden] { display: none !important; }
img { max-width: 100%; }
/* Складская накладная: бумага, чернила, жёлтая грузовая лента. Плоско, острые углы, цифры моноширинным. */
:root {
  --paper: #f1f2ef;
  --sheet: #ffffff;
  --sheet-2: #e7e9e5;
  --line: #d5d8d3;
  --ink: #15171a;
  --muted: #5d636b;
  --tape: #ffd21f;
  --tape-ink: #15171a;
  --pos: #0b7a4b;
  --neg: #c2362f;
  --link: #15171a;
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 4px;
  --nav-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111214; --sheet: #1a1c1f; --sheet-2: #24272b; --line: #2e3237;
    --ink: #eceeef; --muted: #959ba3; --tape: #f2c419; --tape-ink: #111214;
    --pos: #3fcb8b; --neg: #ff7a6b; --link: #eceeef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111214; --sheet: #1a1c1f; --sheet-2: #24272b; --line: #2e3237;
  --ink: #eceeef; --muted: #959ba3; --tape: #f2c419; --tape-ink: #111214;
  --pos: #3fcb8b; --neg: #ff7a6b; --link: #eceeef; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
a { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
h1 { font: 600 22px/1.2 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 600 16px/1.3 var(--f-body); margin: 0; }
h3 { font: 500 12px/1.4 var(--f-mono); margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.num, .calc .v, td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.small { font-size: 13px; }

/* ── каркас ── */
.layout { min-height: 100vh; }
.view { padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1080px; margin: 0 auto; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around; align-items: stretch;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: var(--sheet); border-top: 1px solid var(--line);
}
.nav .brand { display: none; }
.nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 11px; font-weight: 500; text-decoration: none; position: relative;
}
.nav a svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
.nav a.active { color: var(--ink); }
.nav a.active::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 3px; background: var(--tape); }

@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: 216px 1fr; }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; flex-direction: column; justify-content: flex-start;
    gap: 0; padding: 18px 0; border-top: 0; border-right: 1px solid var(--line);
  }
  .nav .brand { display: flex; align-items: center; gap: 10px; font: 600 16px var(--f-display); padding: 2px 20px 22px; }
  .nav .brand svg, .nav .brand img { width: 28px; height: 28px; }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 20px; font-size: 14px; }
  .nav a:hover { color: var(--ink); background: var(--sheet-2); }
  .nav a.active { background: var(--sheet-2); }
  .nav a.active::before { top: 0; bottom: 0; left: 0; right: auto; width: 4px; height: auto; }
  .view { padding-block: 30px 48px; padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); width: 100%; }
}

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 20px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; text-decoration: none; }
.section { margin: 30px 0 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ── блоки ── */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card + .card { margin-top: 8px; }
.grid { display: grid; gap: 0; }

/* итоговые цифры — как строка в накладной: ячейки через линию */
.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis > .card { border: 0; border-radius: 0; margin: 0; }
.kpi { padding: 14px 16px; }
.kpi .label { color: var(--muted); font: 500 11px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.kpi .value { font: 500 21px/1.25 var(--f-mono); margin-top: 6px; letter-spacing: -.03em; }
.kpi .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.kpi.hero { grid-column: 1 / -1; padding: 18px 16px 20px; }
.kpi.hero .value { font: 600 38px/1.1 var(--f-display); letter-spacing: -.02em; margin-top: 8px; }
@media (min-width: 700px) { .kpi.hero .value { font-size: 46px; } }

/* предупреждение — полоса грузовой ленты */
.alert { position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 12px 30px; font-weight: 500; display: flex; gap: 10px; align-items: center; overflow: hidden; }
.alert::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px;
  background: repeating-linear-gradient(-45deg, var(--tape) 0 6px, var(--tape-ink) 6px 12px); }
.alert a { color: inherit; }

/* шкала окупаемости — с делениями, как линейка */
.progress { height: 10px; background: var(--sheet-2); margin-top: 12px; position: relative; border-radius: 1px; overflow: hidden; }
.progress > div { height: 100%; background: var(--pos); }
.progress::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--sheet) calc(10% - 1px) 10%); }

.list-link { display: block; color: inherit; text-decoration: none; }
a.card.list-link:hover { border-color: var(--ink); }
.list-link:active { opacity: .7; }

/* ── расчёт ── */
.calc { display: grid; grid-template-columns: 1fr auto; gap: 7px 16px; }
.calc .k { color: var(--muted); }
.calc .v { text-align: right; }
.calc .sep { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin: 4px 0; }
.calc .strong { font-weight: 600; color: var(--ink); }
@media (min-width: 700px) { .calc.two { grid-template-columns: 1fr auto 1fr auto; column-gap: 28px; } }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 2px; border: 1px solid var(--line); background: transparent; font: 500 11.5px/1.5 var(--f-mono); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--pos); border-color: currentColor; }
.chip.bad { color: var(--neg); border-color: currentColor; }
.chip.warn { color: var(--tape-ink); background: var(--tape); border-color: var(--tape); }
.chip.accent { color: var(--ink); border-color: var(--ink); }
button.chip { cursor: pointer; }

/* ── товары ── */
.item { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start; }
.thumb {
  width: 72px; height: 72px; border-radius: 2px; background: var(--sheet-2);
  display: flex; align-items: center; justify-content: center; color: var(--muted);
  font: 500 10px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; text-align: center;
  border: 1px dashed var(--line); padding: 4px; cursor: pointer; overflow: hidden;
}
.thumb:has(img) { border-style: solid; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.item-title { font-weight: 600; font-size: 16px; }
.item-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; margin-top: 10px; font-size: 13px; }
.item-meta div { font-family: var(--f-mono); letter-spacing: -.02em; white-space: nowrap; }
.item-meta div span { color: var(--muted); font-family: var(--f-body); letter-spacing: 0; }
.item-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.yuan { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.yuan input { width: 110px; font-family: var(--f-mono); }
.yuan.missing input { border-color: var(--tape); box-shadow: inset 0 0 0 1px var(--tape); }

.stock-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 700px) { .stock-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { padding: 0; overflow: hidden; cursor: pointer; text-align: left; font: inherit; color: inherit; margin: 0 !important; }
.tile:hover { border-color: var(--ink); }
.tile .ph { aspect-ratio: 1; background: var(--sheet-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
.tile .ph img { width: 100%; height: 100%; object-fit: cover; }
.tile .body { padding: 10px 12px 12px; }
.tile .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.tile .p { font: 500 16px var(--f-mono); margin-top: 4px; letter-spacing: -.02em; }
.tile.soldout { opacity: .5; }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.photos .ph { position: relative; aspect-ratio: 1; border-radius: 2px; overflow: hidden; background: var(--sheet-2); }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.photos .ph button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 2px; border: 0; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; font-size: 12px; padding: 0; }
.photos label.add { aspect-ratio: 1; border: 1px dashed var(--muted); border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; font: 500 11px var(--f-mono); text-transform: uppercase; gap: 2px; }
.photos label.add b { font: 300 26px var(--f-body); }

/* ── график ── */
.chart { display: flex; gap: 4px; height: 170px; align-items: stretch; }
.chart .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.chart .bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; border-bottom: 1px solid var(--ink); }
.chart .bars i { width: 36%; max-width: 20px; background: var(--ink); }
.chart .bars i.profit { background: var(--tape); }
.chart .col span { font: 11px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

/* ── формы ── */
button, .btn {
  font: 600 14px var(--f-body); border-radius: var(--r); border: 1px solid var(--ink);
  background: transparent; color: var(--ink); padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
button:hover { background: var(--sheet-2); }
button:active { transform: translateY(1px); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
button.primary { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
button.primary:hover { filter: brightness(.95); background: var(--tape); }
button.danger { color: var(--neg); border-color: var(--neg); }
button.sm { padding: 6px 11px; font-size: 13px; }
button.block { width: 100%; }
button:disabled { opacity: .4; cursor: default; }
.icon-btn { border: 0; background: transparent; padding: 6px 8px; font-size: 16px; color: var(--muted); }
.icon-btn:hover { color: var(--ink); background: transparent; }

label.f { display: block; margin-bottom: 12px; }
label.f > span { display: block; font: 500 11px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 12px; width: 100%; min-width: 0;
}
input[type="number"] { font-family: var(--f-mono); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }
.f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f-row.three { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 420px) { .f-row.three { grid-template-columns: 1fr 1fr; } }
.hint-line { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; font-size: 13px; color: var(--ink); }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.search { max-width: 320px; }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.check input { width: auto; accent-color: var(--ink); }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--ink); }
table.t td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td input { padding: 6px 8px; }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ── окно ── */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(10, 11, 13, .5); }
.sheet-panel {
  position: relative; background: var(--sheet); width: 100%; max-width: 540px; max-height: 92vh; overflow: auto;
  border-radius: 6px 6px 0 0; border-top: 4px solid var(--tape); padding: 0 16px calc(20px + env(safe-area-inset-bottom));
  animation: up .16s ease-out;
}
@media (min-width: 700px) { .sheet { align-items: center; } .sheet-panel { border-radius: var(--r); padding-bottom: 20px; } }
@keyframes up { from { transform: translateY(20px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet-panel { animation: none; } }
.sheet-head { position: sticky; top: 0; background: var(--sheet); display: flex; align-items: center; justify-content: space-between; padding: 14px 0 12px; z-index: 1; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sheet-head h2 { font: 600 15px var(--f-display); }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.lightbox[hidden] { display: none; }
.lightbox img { max-width: 96vw; max-height: 92vh; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--r); border-left: 6px solid var(--tape);
  z-index: 70; font-weight: 500; max-width: calc(100vw - 32px);
}
.toast[hidden] { display: none; }
@media (min-width: 900px) { .toast { bottom: 24px; } }

/* ── склад ── */
.stock-count b { color: var(--ink); font-weight: 500; }
.tile-sell { margin-top: 10px; }
.toast { display: flex; align-items: center; gap: 14px; width: max-content; }
.toast-btn { border: 0; background: var(--tape); color: var(--tape-ink); padding: 6px 10px; font-size: 13px; flex: none; }
.toast-btn:hover { background: var(--tape); filter: brightness(.95); }

.nav a span { white-space: nowrap; }
@media (max-width: 420px) { .nav a { font-size: 10px; } }

</style>

<body>
<div class="layout">
    <nav class="nav" id="nav">
      <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="56" fill="#15171a"/><path d="M256 104l136 72v160l-136 72-136-72V176z" fill="none" stroke="#ffffff" stroke-width="30" stroke-linejoin="miter"/><path d="M120 176l136 72 136-72M256 248v160" fill="none" stroke="#ffffff" stroke-width="30"/><rect x="306" y="314" width="132" height="132" fill="#ffd21f"/><path d="M372 346v68M338 380h68" stroke="#15171a" stroke-width="20"/></svg><span>Товарка</span></div>
      <a href="#" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></a>
      <a href="#batches" data-route="batches"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg><span>Партии</span></a>
      <a href="#stock" data-route="stock"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Склад</span></a>
      <a href="#sales" data-route="sales"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg><span>Продажи</span></a>
      <a href="#options" data-route="options"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Настройки</span></a>
    </nav>
    <main id="view" class="view"></main>
  </div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>
  <div id="lightbox" class="lightbox" hidden><img alt=""></div>
  <div id="toast" class="toast" hidden></div>
  <script>
'use strict';
/* Хранилище и расчёты для версии на claude.ai.
   Повторяет серверное API (app/main.py), но данные лежат в db артефакта,
   а фото — в его assets. Расчёты — копия app/calc.py. */

const DEFAULTS = {
  cny_markup: 0.5, usd_rate: 89.5, cargo_usd_per_kg: 2.9, rf_delivery_rub: 2000,
  stale_days: 14, cny_cbr: 11.0, cny_cbr_date: '',
};
const COLLS = ['categories', 'batches', 'items', 'sales', 'expenses', 'photos'];
const S = { settings: {}, ready: false, failed: '' };
COLLS.forEach((c) => (S[c] = new Map()));
let DB = null;
let ASSETS = null;

const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
function nowIso() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const todayIso = () => nowIso().slice(0, 10);
const parseTs = (s) => (s ? new Date(String(s).replace(' ', 'T')) : null);
function daysSince(ts) { const d = parseTs(ts); return d && !isNaN(d) ? Math.floor((Date.now() - d) / 86400000) : 0; }

class ApiError extends Error {}
const fail = (msg) => { throw new ApiError(msg); };

/* ───── запись ───── */
function clean(o) { const { id, ...rest } = o; return rest; }
async function put(coll, id, data) {
  const body = clean(data);
  S[coll].set(id, { ...body, id });
  await DB.collection(coll).doc(id).set(body);
}
async function patch(coll, id, data) {
  const cur = S[coll].get(id);
  if (!cur) fail('Запись не найдена');
  await put(coll, id, { ...cur, ...data });
}
async function del(coll, id) { S[coll].delete(id); await DB.collection(coll).doc(id).delete(); }
const newId = (coll) => DB.collection(coll).doc().id;
const list = (coll) => [...S[coll].values()];

/* ───── расчёт партии (копия calc.py) ───── */
function calcBatch(p, items, sales, expenses) {
  const totalWeight = items.reduce((a, i) => a + Math.max(i.qty, 0) * Math.max(i.weight_kg, 0), 0);
  const has = totalWeight > 0;
  const cargo = totalWeight * p.cargo_usd_per_kg * p.usd_rate;
  const rf = has ? p.rf_delivery_rub : 0;
  const logistics = cargo + rf;
  const perKg = has ? logistics / totalWeight : 0;
  const active = sales.filter((s) => !s.returned);
  const byItem = {};
  active.forEach((s) => (byItem[s.item_id] ||= []).push(s));

  const calcs = {};
  let buyTotal = 0, plannedRevenue = 0, revenue = 0, soldCost = 0;
  const remainingPrices = [];
  for (const it of items) {
    const unitBuy = it.buy_cny * p.cny_rate;
    const unitLog = it.weight_kg * perKg;
    const unitCost = unitBuy + unitLog;
    const ss = byItem[it.id] || [];
    const sold = ss.reduce((a, s) => a + s.qty, 0);
    const itRevenue = ss.reduce((a, s) => a + s.price * s.qty - (s.extra_cost || 0), 0);
    const stock = Math.max(it.qty - sold - (it.reserved || 0), 0);
    const unsold = Math.max(it.qty - sold, 0);
    buyTotal += unitBuy * it.qty;
    plannedRevenue += it.sell_price * it.qty;
    revenue += itRevenue;
    soldCost += unitCost * sold;
    for (let k = 0; k < unsold; k++) remainingPrices.push(it.sell_price);
    const margin = it.sell_price - unitCost;
    calcs[it.id] = {
      qty: it.qty, weight_kg: it.weight_kg, total_weight_kg: r2(it.weight_kg * it.qty),
      unit_buy_rub: r2(unitBuy), unit_logistics_rub: r2(unitLog), unit_cost_rub: r2(unitCost),
      unit_margin_rub: r2(margin), margin_pct: it.sell_price ? r2((margin / it.sell_price) * 100) : 0,
      sold, reserved: it.reserved || 0, stock, revenue_rub: r2(itRevenue), profit_rub: r2(itRevenue - unitCost * sold),
    };
  }
  const totalCost = buyTotal + logistics + expenses;
  const plannedProfit = plannedRevenue - totalCost;
  const payback = revenue - totalCost;
  let breakeven = 0;
  if (payback < 0) {
    breakeven = null;
    let acc = 0;
    const sorted = remainingPrices.sort((a, b) => b - a);
    for (let n = 0; n < sorted.length; n++) { acc += sorted[n]; if (acc >= -payback - 1e-9) { breakeven = n + 1; break; } }
  }
  const unitsTotal = items.reduce((a, i) => a + i.qty, 0);
  const unitsSold = Object.values(calcs).reduce((a, c) => a + c.sold, 0);
  return {
    calc: {
      total_weight_kg: r2(totalWeight), cargo_rub: r2(cargo), rf_delivery_rub: r2(rf), logistics_rub: r2(logistics),
      logistics_per_kg_rub: r2(perKg), buy_rub: r2(buyTotal), expenses_rub: r2(expenses), total_cost_rub: r2(totalCost),
      units_total: unitsTotal, units_sold: unitsSold, units_left: Math.max(unitsTotal - unitsSold, 0),
      planned_revenue_rub: r2(plannedRevenue), planned_profit_rub: r2(plannedProfit), revenue_rub: r2(revenue),
      profit_rub: r2(revenue - soldCost - expenses), payback_rub: r2(payback),
      roi_pct: totalCost ? r2((plannedProfit / totalCost) * 100) : 0, breakeven_units: breakeven,
    },
    items: calcs,
  };
}

/* ───── сборка данных для экрана ───── */
function settingsOut() {
  const s = { ...DEFAULTS, ...S.settings };
  return { ...s, cny_rate: r2(s.cny_cbr + s.cny_markup) };
}
const photoUrl = (p) => `/_blob/${p.asset_id}`;
function photosOf(itemId) {
  return list('photos').filter((p) => p.item_id === itemId).sort((a, b) => (a.created_at > b.created_at ? 1 : -1))
    .map((p) => ({ id: p.id, url: photoUrl(p) }));
}
function batchFull(id) {
  const raw = S.batches.get(id);
  if (!raw) fail('Партия не найдена');
  const b = { ...raw };
  const cnyRate = r2(b.cny_cbr + b.cny_markup);
  const cats = S.categories;
  const items = list('items').filter((i) => i.batch_id === id)
    .sort((a, b2) => (a.created_at === b2.created_at ? (a.id > b2.id ? 1 : -1) : a.created_at > b2.created_at ? 1 : -1))
    .map((i) => ({ ...i, reserved: i.reserved || 0, listed: !!i.listed, category: cats.get(i.category_id)?.name || null }));
  const ids = new Set(items.map((i) => i.id));
  const sales = list('sales').filter((s) => ids.has(s.item_id));
  const expenses = list('expenses').filter((e) => e.batch_id === id).sort((a, c) => (a.spent_at < c.spent_at ? 1 : -1));
  const res = calcBatch({ cny_rate: cnyRate, usd_rate: b.usd_rate, cargo_usd_per_kg: b.cargo_usd_per_kg, rf_delivery_rub: b.rf_delivery_rub },
    items, sales, expenses.reduce((a, e) => a + e.amount, 0));
  for (const i of items) {
    i.calc = res.items[i.id];
    i.photos = photosOf(i.id);
    i.batch_name = b.name;
    i.batch_status = b.status;
  }
  return { ...b, cny_rate: cnyRate, calc: res.calc, items, expenses, missing_buy_price: items.filter((i) => !(i.buy_cny > 0)).length };
}
const allBatches = () => list('batches').sort((a, b) => (a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : 0)).map((b) => batchFull(b.id));
function soldCount(itemId) { return list('sales').filter((s) => s.item_id === itemId && !s.returned).reduce((a, s) => a + s.qty, 0); }

/* ───── операции ───── */
const ops = {
  settings: () => settingsOut(),
  async saveSettings(body) {
    const next = { ...DEFAULTS, ...S.settings };
    for (const [k, v] of Object.entries(body)) if (v !== null && v !== undefined && k in DEFAULTS) next[k] = Number(v);
    if (body.cny_cbr != null) next.cny_cbr_date = `вручную ${todayIso()}`;
    S.settings = next;
    await DB.doc('app/settings').set(next);
    return settingsOut();
  },
  categories: () => list('categories').sort((a, b) => a.sort - b.sort || (a.id > b.id ? 1 : -1)),
  async addDefaultCategories() {
    const defs = [['Футболка', 0.3, 2000], ['Худи / свитшот', 0.8, 3000], ['Штаны', 0.6, 2500], ['Куртка / ветровка', 1.0, 3500],
      ['Пуховик', 1.5, 4000], ['Обувь (с коробкой)', 1.5, 4000], ['Аксессуары', 0.2, 1000]];
    let n = 0;
    for (const [name, weight_kg, default_price] of defs) await put('categories', newId('categories'), { name, weight_kg, default_price, sort: n++ });
  },
  async addCategory(b) {
    const sort = Math.max(0, ...list('categories').map((c) => c.sort || 0)) + 1;
    await put('categories', newId('categories'), { name: b.name.trim(), weight_kg: b.weight_kg, default_price: b.default_price || 0, sort });
  },
  async saveCategory(id, b) {
    if (!b.name?.trim()) fail('Впиши название типа');
    if (!(b.weight_kg > 0)) fail('Вес должен быть больше нуля');
    await patch('categories', id, { name: b.name.trim(), weight_kg: b.weight_kg, default_price: b.default_price || 0 });
  },
  delCategory: (id) => del('categories', id),

  batches: () => allBatches().map((b) => ({ ...b, items_count: b.items.length })),
  batch: (id) => batchFull(id),
  async createBatch(body) {
    const s = settingsOut();
    const status = body.status || 'transit';
    const id = newId('batches');
    const pick = (k) => (body[k] === null || body[k] === undefined || body[k] === '' ? s[k] : Number(body[k]));
    await put('batches', id, {
      name: (body.name || '').trim() || `Партия №${S.batches.size + 1}`, status, created_at: nowIso(),
      received_at: status === 'received' ? nowIso() : null,
      cny_cbr: pick('cny_cbr'), cny_markup: pick('cny_markup'), usd_rate: pick('usd_rate'),
      cargo_usd_per_kg: pick('cargo_usd_per_kg'), rf_delivery_rub: pick('rf_delivery_rub'), note: body.note || '',
    });
    return batchFull(id);
  },
  async saveBatch(id, body) {
    const cur = S.batches.get(id);
    if (!cur) fail('Партия не найдена');
    const data = {};
    for (const k of ['name', 'status', 'note']) if (body[k] != null) data[k] = body[k];
    for (const k of ['cny_cbr', 'cny_markup', 'usd_rate', 'cargo_usd_per_kg', 'rf_delivery_rub']) if (body[k] != null) data[k] = Number(body[k]);
    if ('name' in data) data.name = data.name.trim() || cur.name;
    if (data.status === 'received' && !cur.received_at) data.received_at = nowIso();
    await patch('batches', id, data);
    return batchFull(id);
  },
  async delBatch(id) {
    const items = list('items').filter((i) => i.batch_id === id);
    for (const i of items) await ops.delItem(i.id, true);
    for (const e of list('expenses').filter((e) => e.batch_id === id)) await del('expenses', e.id);
    await del('batches', id);
  },

  async createItem(batchId, b) {
    batchFull(batchId);
    const cat = b.category_id ? S.categories.get(b.category_id) : null;
    if (b.category_id && !cat) fail('Нет такого типа вещи');
    const weight = b.weight_kg || cat?.weight_kg;
    if (!weight) fail('Выбери тип вещи — по нему ставится вес');
    if (!b.title?.trim()) fail('Впиши название');
    if (!(b.qty >= 1)) fail('Количество — от 1 шт');
    await put('items', newId('items'), {
      batch_id: batchId, category_id: b.category_id || null, title: b.title.trim(), color: (b.color || '').trim(), size: (b.size || '').trim(),
      qty: Math.floor(b.qty), weight_kg: weight, buy_cny: b.buy_cny || 0,
      sell_price: b.sell_price ?? cat?.default_price ?? 0, reserved: 0, listed: !!b.listed, note: b.note || '', created_at: nowIso(),
    });
    return batchFull(batchId);
  },
  async saveItem(id, body) {
    const it = S.items.get(id);
    if (!it) fail('Товар не найден');
    const data = {};
    for (const [k, v] of Object.entries(body)) if (v !== null && v !== undefined) data[k] = v;
    if (data.category_id && data.category_id !== it.category_id && body.weight_kg == null) {
      const cat = S.categories.get(data.category_id);
      if (!cat) fail('Нет такого типа вещи');
      data.weight_kg = cat.weight_kg;
    }
    if (data.title !== undefined && !String(data.title).trim()) fail('Впиши название');
    if (data.weight_kg !== undefined && !(data.weight_kg > 0)) fail('Вес должен быть больше нуля');
    if (data.buy_cny !== undefined && data.buy_cny < 0) fail('Цена не может быть отрицательной');
    const qty = data.qty ?? it.qty;
    const sold = soldCount(id);
    if (qty < 1) fail('Количество — от 1 шт');
    if (qty < sold) fail(`Уже продано ${sold} шт — меньше нельзя`);
    if ((data.reserved ?? it.reserved ?? 0) < 0) fail('Бронь не может быть меньше нуля');
    if ((data.reserved ?? it.reserved ?? 0) > qty - sold) fail('Бронь больше, чем осталось');
    if ('listed' in data) data.listed = !!data.listed;
    await patch('items', id, data);
    return batchFull(it.batch_id);
  },
  async delItem(id, quiet) {
    const it = S.items.get(id);
    if (!it) return;
    for (const p of list('photos').filter((p) => p.item_id === id)) await ops.delPhoto(p.id);
    for (const s of list('sales').filter((s) => s.item_id === id)) await del('sales', s.id);
    await del('items', id);
    return quiet ? null : batchFull(it.batch_id);
  },
  stock() {
    const staleDays = settingsOut().stale_days;
    const out = [];
    for (const b of allBatches()) for (const i of b.items) {
      i.days_in_stock = b.status === 'received' ? daysSince(b.received_at) : 0;
      i.stale = b.status === 'received' && i.calc.stock > 0 && i.days_in_stock >= staleDays;
      out.push(i);
    }
    return out;
  },

  async uploadPhotos(itemId, files) {
    if (!ASSETS) fail('Фото может добавлять только владелец страницы');
    for (const f of files) {
      const blob = await compress(f);
      let res;
      try { res = await ASSETS.upload(blob, { type: blob.type || 'image/jpeg' }); } catch (e) {
        fail(e?.code === 'too_large' ? 'Фото слишком большое' : e?.code === 'unsupported_type' ? 'Это не картинка (нужен JPG, PNG или WebP)' : 'Не получилось загрузить фото, попробуй ещё раз');
      }
      await put('photos', newId('photos'), { item_id: itemId, asset_id: res.id, created_at: nowIso() });
    }
    return photosOf(itemId);
  },
  async delPhoto(id) {
    const p = S.photos.get(id);
    if (!p) return;
    await del('photos', id);
    try { await ASSETS?.delete(p.asset_id); } catch { /* файл мог уже быть удалён */ }
  },

  async createSale(itemId, b) {
    const it = S.items.get(itemId);
    if (!it) fail('Товар не найден');
    const qty = Math.floor(b.qty || 0);
    if (qty < 1) fail('Сколько продал — от 1 шт');
    const free = it.qty - soldCount(itemId) - (it.reserved || 0);
    const available = free + (b.from_reserved ? it.reserved || 0 : 0);
    if (qty > available) fail(`В наличии только ${Math.max(available, 0)} шт`);
    if (b.from_reserved) await patch('items', itemId, { reserved: Math.max((it.reserved || 0) - qty, 0) });
    const saleId = newId('sales');
    await put('sales', saleId, {
      item_id: itemId, qty, price: b.price ?? it.sell_price, extra_cost: b.extra_cost || 0,
      sold_at: b.sold_at || nowIso(), channel: b.channel || 'Авито', note: b.note || '', returned: false,
    });
    return { ...batchFull(it.batch_id), sale_id: saleId };
  },
  sales() {
    const costs = {};
    for (const b of allBatches()) for (const i of b.items) costs[i.id] = i.calc.unit_cost_rub;
    return list('sales').map((s) => {
      const it = S.items.get(s.item_id) || {};
      const b = S.batches.get(it.batch_id) || {};
      const unit = costs[s.item_id] || 0;
      return { ...s, returned: !!s.returned, title: it.title, color: it.color, size: it.size, batch_id: it.batch_id, batch_name: b.name,
        unit_cost_rub: unit, profit_rub: s.returned ? 0 : r2(s.price * s.qty - (s.extra_cost || 0) - unit * s.qty) };
    }).sort((a, b) => (a.sold_at < b.sold_at ? 1 : a.sold_at > b.sold_at ? -1 : 0));
  },
  async saveSale(id, body) {
    const s = S.sales.get(id);
    if (!s) fail('Продажа не найдена');
    if (body.returned === false && s.returned) {
      const it = S.items.get(s.item_id);
      if (soldCount(s.item_id) + s.qty + (it.reserved || 0) > it.qty) fail('Этот товар уже продан повторно — отменить возврат нельзя');
    }
    await patch('sales', id, body);
  },
  delSale: (id) => del('sales', id),

  expenses: () => list('expenses').map((e) => ({ ...e, batch_name: S.batches.get(e.batch_id)?.name || null })).sort((a, b) => (a.spent_at < b.spent_at ? 1 : -1)),
  async addExpense(b) {
    if (!b.title?.trim()) fail('Впиши, на что расход');
    if (!(b.amount > 0)) fail('Сумма должна быть больше нуля');
    await put('expenses', newId('expenses'), { batch_id: b.batch_id || null, title: b.title.trim(), amount: b.amount, spent_at: b.spent_at || nowIso() });
  },
  delExpense: (id) => del('expenses', id),

  dashboard() {
    const s = settingsOut();
    const batches = allBatches();
    const general = list('expenses').filter((e) => !e.batch_id).reduce((a, e) => a + e.amount, 0);
    const total = (k) => batches.reduce((a, b) => a + b.calc[k], 0);
    const invested = total('total_cost_rub') + general;
    const revenue = total('revenue_rub');
    const profit = total('profit_rub') - general;
    const planned = total('planned_profit_rub') - general;

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(today); start.setDate(start.getDate() - ((today.getDay() + 6) % 7) - 49);
    const weeks = Array.from({ length: 8 }, (_, n) => { const d = new Date(start); d.setDate(d.getDate() + n * 7); return { week: d, revenue: 0, profit: 0, units: 0 }; });
    const itemsById = {};
    batches.forEach((b) => b.items.forEach((i) => (itemsById[i.id] = i)));
    for (const sale of list('sales')) {
      if (sale.returned) continue;
      const d = parseTs(sale.sold_at); if (!d || isNaN(d)) continue;
      const idx = Math.floor((d - start) / (7 * 86400000));
      if (idx < 0 || idx > 7) continue;
      const net = sale.price * sale.qty - (sale.extra_cost || 0);
      weeks[idx].revenue += net;
      weeks[idx].profit += net - (itemsById[sale.item_id]?.calc.unit_cost_rub || 0) * sale.qty;
      weeks[idx].units += sale.qty;
    }
    const items = Object.values(itemsById);
    const top = items.filter((i) => i.calc.sold > 0)
      .map((i) => ({ id: i.id, title: i.title, color: i.color, sold: i.calc.sold, profit: i.calc.profit_rub }))
      .sort((a, b) => b.profit - a.profit).slice(0, 5);
    const stale = [];
    for (const b of batches) {
      if (b.status !== 'received') continue;
      const days = daysSince(b.received_at);
      if (days < s.stale_days) continue;
      for (const i of b.items) if (i.calc.stock > 0) stale.push({ id: i.id, title: i.title, color: i.color, stock: i.calc.stock, days, batch_id: b.id });
    }
    return {
      settings: s, invested_rub: r2(invested), revenue_rub: r2(revenue), profit_rub: r2(profit), planned_profit_rub: r2(planned),
      payback_rub: r2(revenue - invested), roi_pct: invested ? r2((planned / invested) * 100) : 0,
      units_total: total('units_total'), units_sold: total('units_sold'), units_left: total('units_left'),
      stock_value_rub: r2(items.reduce((a, i) => a + i.calc.stock * i.sell_price, 0)), general_expenses_rub: r2(general),
      missing_buy_price: batches.reduce((a, b) => a + b.missing_buy_price, 0),
      weeks: weeks.map((w) => ({ ...w, revenue: r2(w.revenue), profit: r2(w.profit) })), top, stale,
      batches: batches.map((b) => ({ id: b.id, name: b.name, status: b.status, missing_buy_price: b.missing_buy_price, ...b.calc })),
    };
  },
};

/* Обёртка: любая ошибка хранилища превращается в понятное сообщение. */
async function api(name, ...args) {
  if (!DB) throw new Error(S.failed || 'Хранилище ещё загружается');
  try { return await ops[name](...args); } catch (e) {
    if (e instanceof ApiError) throw e;
    if (e?.code === 'quota_exceeded') throw new Error('Место в хранилище закончилось — удали старые фото или партии');
    if (e?.code === 'invalid_argument') throw new Error('Сохранять может только владелец страницы');
    throw new Error('Не получилось сохранить, попробуй ещё раз');
  }
}

/* ───── подключение к db ───── */
function connectStore(onChange) {
  const pending = new Set(['settings', ...COLLS]);
  const done = (k, fromCache) => { if (!fromCache) pending.delete(k); if (!pending.size && !S.ready) { S.ready = true; clearTimeout(timer); } onChange(); };
  const timer = setTimeout(() => { if (!S.ready) { S.failed = 'Данные долго не загружаются. Проверь интернет.'; onChange(); } }, 10000);
  const onErr = (e) => { S.failed = e?.code === 'revoked' ? 'Доступ к данным закрыт' : 'Связь с хранилищем потеряна. Обнови страницу.'; onChange(); };
  DB.doc('app/settings').onSnapshot((snap) => { S.settings = snap.exists ? { ...snap.data() } : {}; done('settings', snap.metadata.fromCache); }, onErr);
  for (const c of COLLS) {
    DB.collection(c).onSnapshot((snap) => {
      S[c] = new Map(snap.docs.map((d) => [d.id, { ...d.data(), id: d.id }]));
      done(c, snap.metadata.fromCache);
    }, onErr);
  }
}

'use strict';
/* Хранилище для Android-приложения: всё лежит в памяти телефона.
   window.Android — мост в MainActivity.java: файл данных, папка фото и запрос курса ЦБ. */

function makeLocalDb(bridge, seed) {
  let raw = {};
  try { raw = JSON.parse(bridge.loadAll() || '{}'); } catch { raw = {}; }
  const docs = new Map(Object.entries(raw));
  if (!docs.size && seed) { for (const [k, v] of Object.entries(seed)) docs.set(k, v); }
  const subs = new Set();
  const persist = () => {
    if (!bridge.saveAll(JSON.stringify(Object.fromEntries(docs)))) throw { code: 'unavailable', message: 'save failed' };
  };
  if (!raw || !Object.keys(raw).length) persist();
  const notify = () => setTimeout(() => subs.forEach((f) => f()), 0);
  const snap = (path) => ({ id: path.split('/').pop(), exists: docs.has(path), data: () => docs.get(path), metadata: { fromCache: false, hasPendingWrites: false } });
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const docRef = (path) => ({
    id: path.split('/').pop(), path,
    get: async () => snap(path),
    set: async (d) => { docs.set(path, JSON.parse(JSON.stringify(d))); persist(); notify(); },
    update: async (d) => { docs.set(path, { ...(docs.get(path) || {}), ...JSON.parse(JSON.stringify(d)) }); persist(); notify(); },
    delete: async () => { docs.delete(path); persist(); notify(); },
    onSnapshot: (next) => { const f = () => next(snap(path)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
  });
  const collRef = (c) => ({
    path: c,
    doc: (id) => docRef(`${c}/${id || rid()}`),
    onSnapshot: (next) => {
      const f = () => {
        const list = [...docs.keys()].filter((k) => k.startsWith(c + '/') && k.split('/').length === 2).map(snap);
        next({ docs: list, size: list.length, empty: !list.length, metadata: { fromCache: false, hasPendingWrites: false } });
      };
      subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
    },
  });
  return { doc: docRef, collection: collRef };
}

function makeLocalAssets(bridge) {
  const toBase64 = (blob) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
  return {
    upload: async (blob) => {
      const id = bridge.savePhoto(await toBase64(blob));
      if (!id) throw { code: 'upstream_error', message: 'photo not saved' };
      return { id, url: '/_blob/' + id, sizeBytes: blob.size, contentType: 'image/jpeg' };
    },
    delete: async (id) => ({ deleted: !!bridge.deletePhoto(String(id)) }),
  };
}

async function refreshCbrRate(bridge, { quiet } = {}) {
  let res;
  try { res = JSON.parse(bridge.fetchCbr() || '{}'); } catch { res = {}; }
  if (!(res.rate > 0)) { if (!quiet) throw new Error('Не удалось получить курс ЦБ. Проверь интернет.'); return null; }
  const cur = { ...DEFAULTS, ...S.settings };
  if (Math.abs(cur.cny_cbr - res.rate) < 0.00005 && cur.cny_cbr_date === res.date) return res;
  const next = { ...cur, cny_cbr: res.rate, cny_cbr_date: res.date };
  S.settings = next;
  await DB.doc('app/settings').set(next);
  return res;
}

let toastTimer;
function toast(msg, action) {

  if (action) {

  for (const el of form.elements) {

/* ───────────── фото: сжатие на устройстве ───────────── */
async function compress(file, max = 1600) {
  if (!file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    return blob ? new File([blob], 'photo.jpg', { type: 'image/jpeg' }) : file;
  } catch { return file; }
}

    </div></div>` : ''}`;
}

function chart(weeks) {
  const max = Math.max(1, ...weeks.map((w) => Math.max(w.revenue, w.profit)));
  const h = (v) => `${Math.max(0, (v / max) * 100)}%`;
  const cols = weeks.map((w) => {
    const label = new Date(w.week).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    return `<div class="col" title="Неделя с ${label}: выручка ${rub(w.revenue)}, прибыль ${rub(w.profit)}, ${w.units} шт">
      <div class="bars"><i style="height:${h(w.revenue)}"></i><i class="profit" style="height:${h(w.profit)}"></i></div>
      <span>${label}</span></div>`;
  }).join('');
  const empty = weeks.every((w) => !w.revenue);
  return `<div class="chart" role="img" aria-label="Выручка и прибыль по неделям">${cols}</div>
    <div class="legend"><span><i style="background:var(--ink)"></i>Выручка</span><span><i style="background:var(--tape)"></i>Прибыль</span>${empty ? '<span>· продаж пока нет</span>' : ''}</div>`;
}

      <label class="f"><span>Сумма, ₽</span><input name="amount" type="number" min="1" step="1" required></label>
      ${batchId ? '' : `<label class="f"><span>Партия</span><select name="batch_id"><option value="">Общий расход (не к партии)</option>${batches.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label>`}
      <button class="primary block">Добавить</button>
    </form>`, (el) => {
    $('#ef', el).onsubmit = guard(async (e) => {
      e.preventDefault();
      const d = formData(e.target);
      d.batch_id = batchId || d.batch_id || null;
      await api('addExpense', d);
      closeSheet(); toast('Расход добавлен'); rerender();
    });
  });
}

/* ───────────── склад ───────────── */
let stockFilter = 'in';
let stockQuery = '';
async function quickSell(i) {
  const fromReserved = i.calc.stock === 0 && i.calc.reserved > 0;
  const r = await api('createSale', i.id, { qty: 1, price: i.sell_price, extra_cost: 0, from_reserved: fromReserved });
  const reservedBefore = i.calc.reserved;
  toast(`Продано: ${itemName(i)} за ${rub(i.sell_price)}`, {
    label: 'Отменить',
    run: async () => {
      await api('delSale', r.sale_id);
      if (fromReserved) await api('saveItem', i.id, { reserved: reservedBefore });
      toast('Продажа отменена'); rerender();
    },
  });
  rerender();
}

async function viewStock() {
  const all = await api('stock');
  const draw = () => {
    const q = stockQuery.trim().toLowerCase();
    const list = all.filter((i) => (stockFilter === 'all' || (stockFilter === 'in' ? i.calc.stock + i.calc.reserved > 0 : i.stale))
      && (!q || itemName(i).toLowerCase().includes(q)));
    const units = list.reduce((s, i) => s + i.calc.stock, 0);
    const reservedUnits = list.reduce((s, i) => s + i.calc.reserved, 0);
    const value = list.reduce((s, i) => s + i.calc.stock * i.sell_price, 0);
    $('#stock-list').innerHTML = list.length ? `<div class="stock-grid">${list.map((i) => `
      <div class="card tile ${i.calc.stock + i.calc.reserved ? '' : 'soldout'}" data-open="${i.id}" role="button" tabindex="0">
        <div class="ph">${i.photos[0] ? `<img src="${i.photos[0].url}" alt="" loading="lazy">` : 'нет фото'}</div>
        <div class="body"><div class="t">${esc(itemName(i))}</div>
          <div class="p num">${rub(i.sell_price)}</div>
          <div class="chips" style="margin-top:6px"><span class="chip ${i.calc.stock ? 'ok' : ''}">${i.calc.stock ? `${i.calc.stock} шт` : 'нет'}</span>
            ${i.calc.reserved ? `<span class="chip accent">бронь ${i.calc.reserved}</span>` : ''}${i.batch_status === 'transit' ? '<span class="chip">в пути</span>' : ''}
            ${i.stale ? `<span class="chip warn">${i.days_in_stock} дн.</span>` : ''}${i.listed ? '<span class="chip">на Авито</span>' : ''}</div>
          ${i.calc.stock + i.calc.reserved ? `<button class="sm primary block tile-sell" data-qsell="${i.id}">Продал 1 шт</button>` : ''}</div>
      </div>`).join('')}</div>` : '<div class="card empty"><b>Ничего не нашлось</b>Попробуй другой фильтр</div>';
    $('#stock-count').innerHTML = `<b class="num">${units}</b> шт свободно · <b class="num">${reservedUnits}</b> в брони · на <b class="num">${rub(value)}</b>`;
    $$('[data-open]').forEach((x) => {
      const open = () => stockItemSheet(all.find((i) => String(i.id) === x.dataset.open));
      x.onclick = (e) => { if (!e.target.closest('[data-qsell]')) open(); };
      x.onkeydown = (e) => { if (e.key === 'Enter' && e.target === x) open(); };
    });
    $$('[data-qsell]').forEach((x) => (x.onclick = guard(async () => { x.disabled = true; await quickSell(all.find((i) => String(i.id) === x.dataset.qsell)); })));
  };
  view.innerHTML = `
    <div class="page-head"><h1>Склад</h1><span class="small muted stock-count" id="stock-count"></span></div>
    <div class="row" style="margin-bottom:14px">
      <div class="seg" id="seg">${[['in', 'В наличии'], ['stale', 'Залежались'], ['all', 'Все']].map(([k, t]) => `<button data-f="${k}" class="${stockFilter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <input class="search" type="search" placeholder="Поиск…" value="${esc(stockQuery)}" id="q">
    </div>
    <div id="stock-list"></div>`;
  $$('#seg button').forEach((x) => (x.onclick = () => { stockFilter = x.dataset.f; $$('#seg button').forEach((y) => y.classList.toggle('on', y === x)); draw(); }));
  $('#q').oninput = (e) => { stockQuery = e.target.value; draw(); };
  draw();
}

function stockItemSheet(i) {
  const c = i.calc;
  openSheet(itemName(i), `
    ${i.photos.length ? `<div class="photos" style="margin-bottom:14px">${i.photos.map((p) => `<div class="ph"><img src="${p.url}" alt="" data-full="${p.url}"></div>`).join('')}</div>` : ''}
    <div class="calc">
      <span class="k">Партия</span><span class="v"><a href="#batch-${i.batch_id}">${esc(i.batch_name)}</a></span>
      <span class="k">В наличии</span><span class="v">${c.stock} из ${i.qty} шт</span>
      <span class="k">В брони</span><span class="v">${c.reserved} шт</span>
      <span class="k">Продано</span><span class="v">${c.sold} шт</span>
      <span class="k">Себестоимость</span><span class="v">${rub(c.unit_cost_rub)}</span>
      <span class="k">Цена продажи</span><span class="v">${rub(i.sell_price)}</span>
      <span class="k">Прибыль с 1 шт</span><span class="v">${rubS(c.unit_margin_rub)}</span>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="s-sell" ${c.stock + c.reserved ? '' : 'disabled'}>Продал</button>
      <button id="s-res-plus" ${c.stock ? '' : 'disabled'}>+ Бронь</button>
      <button id="s-res-minus" ${c.reserved ? '' : 'disabled'}>− Бронь</button>
      <button id="s-photos">Фото</button>
    </div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="s-listed" ${i.listed ? 'checked' : ''}> Выставлено на Авито</label>`, (el) => {
    $$('[data-full]', el).forEach((img) => (img.onclick = () => showPhoto(img.dataset.full)));
    $('#s-sell', el).onclick = () => sellForm(i);
    $('#s-photos', el).onclick = () => photosSheet(i);
    const res = (d) => guard(async () => { await api('saveItem', i.id, { reserved: c.reserved + d }); closeSheet(); toast(d > 0 ? 'Забронировано' : 'Бронь снята'); rerender(); });
    $('#s-res-plus', el).onclick = res(1);
    $('#s-res-minus', el).onclick = res(-1);
    $('#s-listed', el).onchange = guard(async (e) => { await api('saveItem', i.id, { listed: e.target.checked }); rerender(); });
  });
}

/* ───────────── продажи ───────────── */
async function viewSales() {
  const [sales, expenses] = await Promise.all([api('sales'), api('expenses')]);
  const active = sales.filter((s) => !s.returned);
  const sum = (k) => active.reduce((a, s) => a + (k === 'rev' ? s.price * s.qty - s.extra_cost : s.profit_rub), 0);
  view.innerHTML = `
    <div class="page-head"><h1>Продажи</h1></div>
    <div class="grid kpis three" style="margin-bottom:16px">
      <div class="card kpi"><div class="label">Продаж</div><div class="value num">${active.reduce((a, s) => a + s.qty, 0)} шт</div></div>
      <div class="card kpi"><div class="label">Выручка</div><div class="value num">${rub(sum('rev'))}</div></div>
      <div class="card kpi"><div class="label">Прибыль</div><div class="value num">${rubS(sum('profit'))}</div></div>
    </div>
    ${sales.length ? `<div class="card" style="padding:4px 8px; overflow-x:auto"><table class="t">
      <thead><tr><th>Дата</th><th>Товар</th><th>Шт</th><th>Цена</th><th>Прибыль</th><th></th></tr></thead>
      <tbody>${sales.map((s) => `<tr style="${s.returned ? 'opacity:.5' : ''}">
        <td class="small">${fmtDate(s.sold_at)}</td>
        <td>${esc(itemName(s))}<div class="small muted">${esc(s.batch_name)}${s.extra_cost ? ` · доп. ${rub(s.extra_cost)}` : ''}${s.returned ? ' · <b>возврат</b>' : ''}</div></td>
        <td class="num">${s.qty}</td><td class="num">${rub(s.price)}</td><td class="num">${s.returned ? '—' : rubS(s.profit_rub)}</td>
        <td><div class="row" style="flex-wrap:nowrap"><button class="sm" data-ret="${s.id}" data-v="${s.returned ? 0 : 1}">${s.returned ? 'Отменить возврат' : 'Возврат'}</button><button class="icon-btn" data-del-sale="${s.id}" aria-label="Удалить">✕</button></div></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="card empty"><b>Продаж пока нет</b>Отметь продажу на складе или в партии кнопкой «Продал»</div>'}

    <div class="section"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Расходы</h3><span class="spacer"></span><button class="sm" id="add-exp">+ Расход</button></div>
      <div class="card">${expenses.length ? expenses.map((e) => `<div class="row" style="padding:3px 0"><span>${esc(e.title)}</span><span class="small muted">${e.batch_name ? esc(e.batch_name) : 'общий'} · ${fmtDate(e.spent_at)}</span><span class="spacer"></span><b class="num">${rub(e.amount)}</b><button class="icon-btn" data-del-exp="${e.id}" aria-label="Удалить">✕</button></div>`).join('')
        : '<span class="muted small">Продвижение, упаковка и прочее. Учитываются в прибыли.</span>'}</div></div>`;
  $$('[data-ret]').forEach((x) => (x.onclick = guard(async () => { await api('saveSale', x.dataset.ret, { returned: x.dataset.v === '1' }); toast(x.dataset.v === '1' ? 'Товар вернулся на склад' : 'Возврат отменён'); rerender(); })));
  $$('[data-del-sale]').forEach((x) => (x.onclick = guard(async () => { if (!(await ask('Удалить запись о продаже?'))) return; await api('delSale', x.dataset.delSale); rerender(); })));
  $('#add-exp').onclick = () => expenseForm(null);
  $$('[data-del-exp]').forEach((x) => (x.onclick = guard(async () => { await api('delExpense', x.dataset.delExp); rerender(); })));
}

/* ───────────── настройки ───────────── */
async function viewSettings() {
  const [s, cats] = await Promise.all([api('settings'), api('categories')]);
  view.innerHTML = `
    <div class="page-head"><h1>Настройки</h1></div>
    <h3>Курсы и доставка</h3>
    <form class="card" id="setf">
      <div class="f-row">
        <label class="f"><span>Юань ЦБ, ₽</span><input name="cny_cbr" type="number" step="0.0001" min="0" value="${s.cny_cbr}"></label>
        <label class="f"><span>Наценка к юаню, ₽</span><input name="cny_markup" type="number" step="0.01" value="${s.cny_markup}"></label>
      </div>
      <p class="hint-line">Курс для выкупа: <b>${nf2.format(s.cny_rate)} ₽</b> за 1 ¥ · ${s.cny_cbr_date ? `обновлён ${esc(s.cny_cbr_date)}` : 'ещё не обновлялся'}${window.Android ? ' · <a href="#" id="refresh-rate">обновить с ЦБ</a>' : ''}</p>
      <div class="f-row">
        <label class="f"><span>Доллар у карго, ₽</span><input name="usd_rate" type="number" step="0.01" min="0" value="${s.usd_rate}"></label>
        <label class="f"><span>Карго, $ за кг</span><input name="cargo_usd_per_kg" type="number" step="0.01" min="0" value="${s.cargo_usd_per_kg}"></label>
      </div>
      <div class="f-row">
        <label class="f"><span>Доставка по РФ на посылку, ₽</span><input name="rf_delivery_rub" type="number" step="1" min="0" value="${s.rf_delivery_rub}"></label>
        <label class="f"><span>Залежался через, дней</span><input name="stale_days" type="number" step="1" min="1" value="${s.stale_days}"></label>
      </div>
      <p class="hint-line">Курс ЦБ обновляется сам при каждом запуске, если есть интернет. Можно поправить вручную. Новые значения применяются к новым партиям. У существующей партии курсы меняются в её «Курсах и настройках».</p>
      <button class="primary">Сохранить</button>
    </form>

    <div class="section"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Типы вещей и вес</h3><span class="spacer"></span><button class="sm" id="add-cat">+ Тип</button></div>
      <div class="card" style="padding:4px 8px; overflow-x:auto"><table class="t">
        <thead><tr><th>Тип</th><th>Вес 1 шт, кг</th><th>Цена по умолч., ₽</th><th></th></tr></thead>
        <tbody>${cats.length ? '' : '<tr><td colspan="4" class="muted">Типов пока нет. <button class="sm" id="add-default-cats">Добавить стандартные</button></td></tr>'}${cats.map((c) => `<tr data-cat="${c.id}">
          <td><input name="name" value="${esc(c.name)}"></td>
          <td style="width:110px"><input name="weight_kg" type="number" step="0.05" min="0.01" value="${c.weight_kg}"></td>
          <td style="width:130px"><input name="default_price" type="number" step="100" min="0" value="${c.default_price}"></td>
          <td style="width:40px"><button class="icon-btn" data-del-cat="${c.id}" aria-label="Удалить">✕</button></td></tr>`).join('')}</tbody>
      </table></div>
      <p class="hint-line" style="margin-top:8px">Меняется сразу при выходе из поля. Вес у уже добавленных товаров не меняется — его можно поправить в самом товаре.</p>
    </div>

    <div class="section"><h3>Данные</h3><div class="card small">
      <p style="margin:0">Партии, продажи и фото хранятся в памяти телефона. Если удалить приложение, они удалятся вместе с ним.</p>
    </div></div>`;

  $('#setf').onsubmit = guard(async (e) => {
    e.preventDefault();
    const d = formData(e.target);
    if (d.cny_cbr === s.cny_cbr) delete d.cny_cbr;
    await api('saveSettings', d);
    toast('Сохранено'); rerender();
  });
  $$('[data-cat]').forEach((tr) => {
    tr.onchange = guard(async () => {
      const body = { name: $('[name=name]', tr).value, weight_kg: Number($('[name=weight_kg]', tr).value), default_price: Number($('[name=default_price]', tr).value || 0) };
      await api('saveCategory', tr.dataset.cat, body); toast('Сохранено');
    });
  });
  $$('[data-del-cat]').forEach((x) => (x.onclick = guard(async () => { if (!(await ask('Удалить этот тип вещи? Товары останутся.'))) return; await api('delCategory', x.dataset.delCat); rerender(); })));
  $('#add-cat').onclick = guard(async () => { await api('addCategory', { name: 'Новый тип', weight_kg: 0.5, default_price: 0 }); rerender(); });
  $('#refresh-rate')?.addEventListener('click', guard(async (e) => {
    e.preventDefault();
    const r = await refreshCbrRate(window.Android);
    toast(`Курс ЦБ: ${nf2.format(r.rate)} ₽ на ${r.date}`); rerender();
  }));
  $('#add-default-cats')?.addEventListener('click', guard(async () => { await api('addDefaultCategories'); toast('Типы добавлены'); rerender(); }));
}

/* ───────────── запуск ───────────── */
// Кнопка «Назад» на Android: сначала закрывает фото и окна, потом листает назад.
window.__onBack = () => {
  if (!$('#lightbox').hidden) { $('#lightbox').hidden = true; return true; }
  if (!$('#sheet').hidden) { closeSheet(); return true; }
  return false;
};
render();
(async () => {
  if (window.Android) {
    DB = makeLocalDb(window.Android, typeof SEED_DOCS === 'undefined' ? null : SEED_DOCS);
    ASSETS = makeLocalAssets(window.Android);
    connectStore(onStoreChange);
    setTimeout(() => refreshCbrRate(window.Android, { quiet: true }).catch(() => {}), 300);
    return;
  }
  const c = window.claude;
  DB = c ? await c.use('db') : null;
  if (!DB) { S.failed = 'Открой эту страницу на claude.ai под своим аккаунтом — там хранятся твои данные.'; render(); return; }
  ASSETS = await c.use('assets');
  connectStore(onStoreChange);
})();

</script>
</body>
</html>
