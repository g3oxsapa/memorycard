        <label class="f"><span>Покупатель / заметка</span><input name="buyer" value="${esc(o.buyer || '')}"></label>
      </div>
      <div class="f-row">
        <label class="f"><span>Цена за 1 шт, ₽</span><input name="price" type="number" min="0" step="1" value="${o.price}"></label>
        <label class="f"><span>Доставка за твой счёт, ₽</span><input name="extra_cost" type="number" min="0" step="1" value="${o.extra_cost || 0}"></label>
      </div>
      <button class="sm">Сохранить изменения</button>
    </form>
    ${can.length ? `<div class="row" style="margin-top:16px">
      ${can.includes('shipped') ? '<button class="primary" data-st="shipped">Отправил</button>' : ''}
      ${can.includes('sold') ? `<button class="${o.status === 'shipped' ? 'primary' : ''}" data-st="sold">Продано</button>` : ''}
      ${can.includes('returned') ? '<button data-st="returned">Возврат</button>' : ''}
      ${can.includes('cancelled') ? '<button class="danger" data-st="cancelled">Отменить заказ</button>' : ''}
    </div>` : ''}
    <button class="ghost sm" id="o-del" style="margin-top:14px">Удалить запись</button>`, (el) => {
    $('#oe', el).onsubmit = guard(async (e) => { e.preventDefault(); await api('saveOrder', o.id, formData(e.target)); closeSheet(); toast('Сохранено'); rerender(); });
    $$('[data-st]', el).forEach((b) => (b.onclick = guard(async () => {
      const st = b.dataset.st;
      if (st === 'shipped') return shipForm(o);
      if (st === 'returned') return returnForm(o);
      if (st === 'cancelled' && !(await ask('Отменить заказ? Вещь вернётся на склад.', 'Отменить заказ'))) return orderSheet(o);
      closeSheet(); await changeStatus(o, st);
    })));
    $('#o-del', el).onclick = guard(async () => {
      if (!(await ask('Удалить запись о заказе совсем? Лучше отменить заказ — так сохранится история.'))) return orderSheet(o);
      await api('delOrder', o.id); rerender();
    });
  });
}

let ordersTab = 'open';
async function viewOrders() {
  const [orders, expenses] = await Promise.all([api('orders'), api('expenses')]);
  const tabs = [
    ['open', 'В работе', (o) => o.status === 'ordered' || o.status === 'shipped'],
    ['sold', 'Проданы', (o) => o.status === 'sold'],
    ['returned', 'Возвраты', (o) => o.status === 'returned'],
    ['cancelled', 'Отменены', (o) => o.status === 'cancelled'],
  ];
  const count = Object.fromEntries(tabs.map(([k, , f]) => [k, orders.filter(f).length]));
  const list = orders.filter(tabs.find((t) => t[0] === ordersTab)[2]);
  const sold = orders.filter((o) => o.status === 'sold');
  const open = orders.filter((o) => o.status === 'ordered' || o.status === 'shipped');
  view.innerHTML = `
    <div class="page-head"><h1>Заказы</h1></div>
    <div class="grid kpis three" style="margin-bottom:16px">
      <div class="card kpi"><div class="label">В работе</div><div class="value num">${open.length}</div><div class="hint">на ${rub(open.reduce((a, o) => a + o.price * o.qty, 0))}</div></div>
      <div class="card kpi"><div class="label">Продано</div><div class="value num">${sold.reduce((a, o) => a + o.qty, 0)} шт</div><div class="hint">${rub(sold.reduce((a, o) => a + o.price * o.qty - (o.extra_cost || 0), 0))}</div></div>
      <div class="card kpi"><div class="label">Прибыль</div><div class="value num">${rubS(orders.reduce((a, o) => a + (o.profit_rub || 0), 0))}</div></div>
    </div>
    <div class="seg" id="otabs" style="margin-bottom:12px">${tabs.map(([k, t]) => `<button data-t="${k}" class="${ordersTab === k ? 'on' : ''}">${t}${count[k] ? ` · ${count[k]}` : ''}</button>`).join('')}</div>
    ${list.length ? list.map((o) => `
      <div class="card order" data-oid="${o.id}" role="button" tabindex="0">
        <div class="thumb sm">${o.photo ? `<img src="${o.photo}" alt="" loading="lazy">` : 'нет<br>фото'}</div>
        <div class="order-main">
          <div class="row"><b>${esc(itemName(o))}</b>${STATUS_CHIP[o.status]}</div>
          <div class="small muted">${o.qty} шт × ${rub(o.price)} · ${fmtDate(o.created_at)}${o.track ? ` · трек ${esc(o.track)}` : ''}${o.buyer ? ` · ${esc(o.buyer)}` : ''}</div>
          ${o.profit_rub != null ? `<div class="small">Прибыль ${rubS(o.profit_rub)}</div>` : ''}
        </div>
        <div class="order-act">
          ${o.status === 'ordered' ? `<button class="sm primary" data-next="shipped" data-id="${o.id}">Отправил</button>` : ''}
          ${o.status === 'shipped' ? `<button class="sm primary" data-next="sold" data-id="${o.id}">Продано</button>` : ''}
        </div>
      </div>`).join('') : `<div class="card empty"><b>${ordersTab === 'open' ? 'Заказов в работе нет' : 'Пока пусто'}</b>${ordersTab === 'open' ? 'Новый заказ оформляется на складе кнопкой «Новый заказ»' : ''}</div>`}

    <div class="section"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Расходы</h3><span class="spacer"></span><button class="sm" id="add-exp">+ Расход</button></div>
      <div class="card">${expenses.length ? expenses.map((e) => `<div class="row" style="padding:3px 0"><span>${esc(e.title)}</span><span class="small muted">${e.batch_name ? esc(e.batch_name) : 'общий'} · ${fmtDate(e.spent_at)}</span><span class="spacer"></span><b class="num">${rub(e.amount)}</b><button class="icon-btn" data-del-exp="${e.id}" aria-label="Удалить">✕</button></div>`).join('')
        : '<span class="muted small">Продвижение, упаковка и прочее. Учитываются в прибыли.</span>'}</div></div>`;
  const byId = Object.fromEntries(orders.map((o) => [o.id, o]));
  $$('#otabs button').forEach((b) => (b.onclick = () => { ordersTab = b.dataset.t; viewOrders(); }));
  $$('[data-oid]').forEach((card) => {
    card.onclick = (e) => { if (!e.target.closest('[data-next]')) orderSheet(byId[card.dataset.oid]); };
    card.onkeydown = (e) => { if (e.key === 'Enter' && e.target === card) orderSheet(byId[card.dataset.oid]); };
  });
  $$('[data-next]').forEach((b) => (b.onclick = guard(async () => {
    const o = byId[b.dataset.id];
    if (b.dataset.next === 'shipped') return shipForm(o);
    await changeStatus(o, 'sold');
  })));
  $('#add-exp').onclick = () => expenseForm(null);
  $$('[data-del-exp]').forEach((x) => (x.onclick = guard(async () => { await api('delExpense', x.dataset.delExp); rerender(); })));
}

'use strict';
/* Экраны входа и регистрации. После успеха — startApp(session). */

function authShell(title, inner) {
  document.body.classList.add('auth-mode');
  view.innerHTML = `
    <div class="auth">
      <div class="auth-brand">${BRAND_SVG}<span>Marginly</span></div>
      <p class="auth-tag">Учёт партий из Китая: карго, себестоимость, склад и прибыль</p>
      <div class="card auth-card">
        <h1>${esc(title)}</h1>
        ${inner}
      </div>
    </div>`;
}

const authState = { email: '' };

function authError(el, e) { el.textContent = e.message || String(e); el.hidden = false; }

function bindForm(handler) {
  const f = $('#auth-form'), err = $('#auth-err'), btn = $('#auth-form button[type=submit]');
  f.onsubmit = async (e) => {
    e.preventDefault();
    err.hidden = true; btn.disabled = true;
    try { await handler(formData(f)); } catch (x) { authError(err, x); } finally { btn.disabled = false; }
  };
}

function finishAuth(res, email) {
  const session = { token: res.token, email: res.user.email || email };
  saveSession(session);
  document.body.classList.remove('auth-mode');
  startApp(session, res.user.plan);
}

function showLogin(msg) {
  authShell('Вход', `
    ${msg ? `<p class="auth-note">${esc(msg)}</p>` : ''}
    <form id="auth-form" novalidate>
      <label class="f"><span>Почта</span><input id="a-email" name="email" type="email" autocomplete="email" required value="${esc(authState.email)}"></label>
      <label class="f"><span>Пароль</span><input id="a-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p class="neg small" id="auth-err" hidden></p>
      <button type="submit" class="primary block">Войти</button>
    </form>
    <div class="auth-links"><a href="#" id="go-register">Регистрация</a><a href="#" id="go-forgot">Забыли пароль?</a></div>
    <div class="auth-demo"><button class="block" id="go-demo">Попробовать без регистрации</button>
      <p class="hint-line">Данные будут только на этом устройстве. Ограничения как в пробной неделе: 1 партия и до 10 товаров.</p></div>
    ${window.__APP_ANDROID ? `<p class="auth-server small muted">Сервер: ${API_BASE ? esc(API_BASE) : 'не задан'} · <a href="#" id="go-server">изменить</a></p>` : ''}`);
  bindForm(async (d) => {
    authState.email = d.email;
    try {
      finishAuth(await http('/api/auth/login', { method: 'POST', body: d }), d.email);
    } catch (e) {
      if (e.status === 403) return showVerify(d.email, e.message);
      throw e;
    }
  });
  $('#go-register').onclick = (e) => { e.preventDefault(); showRegister(); };
  $('#go-forgot').onclick = (e) => { e.preventDefault(); showForgot(); };
  $('#go-demo').onclick = () => { const s = { demo: true, email: 'demo' }; saveSession(s); startApp(s); };
  $('#go-server')?.addEventListener('click', (e) => { e.preventDefault(); showServer(); });
}

function showServer() {
  authShell('Адрес сервера', `
    <p class="auth-note">Обычно менять не нужно. Адрес сервера Marginly появится, когда сервис запустится.</p>
    <form id="auth-form" novalidate>
      <label class="f"><span>Адрес</span><input name="url" type="url" placeholder="https://api.marginly.ru" value="${esc(API_BASE)}"></label>
      <p class="neg small" id="auth-err" hidden></p>
      <button type="submit" class="primary block">Сохранить</button>
    </form>
    <div class="auth-links"><a href="#" id="go-login">Назад</a></div>`);
  bindForm(async (d) => {
    const url = (d.url || '').trim().replace(/\/+$/, '');
    if (url && !/^https:\/\/[^\s/]+/.test(url)) throw new Error('Адрес должен начинаться с https://');
    try { url ? localStorage.setItem('mg:api', url) : localStorage.removeItem('mg:api'); } catch { /* */ }
    API_BASE = url;
    showLogin(url ? 'Адрес сохранён' : 'Адрес сброшен');
  });
  $('#go-login').onclick = (e) => { e.preventDefault(); showLogin(); };
}

function showRegister() {
  authShell('Регистрация', `
    <p class="auth-note">Первая неделя бесплатно: 1 партия и до 10 товаров. Дальше — ${PRICE_RUB} ₽ в месяц.</p>
    <form id="auth-form" novalidate>
      <label class="f"><span>Почта</span><input id="r-email" name="email" type="email" autocomplete="email" required value="${esc(authState.email)}"></label>
      <label class="f"><span>Пароль, от 8 символов</span><input id="r-pass" name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="check"><input type="checkbox" id="r-agree" name="agree"> <span>Принимаю <a href="${LEGAL.terms}" target="_blank" rel="noopener">условия</a> и <a href="${LEGAL.privacy}" target="_blank" rel="noopener">политику конфиденциальности</a>, даю согласие на обработку персональных данных</span></label>
      <p class="neg small" id="auth-err" hidden></p>
      <button type="submit" class="primary block">Зарегистрироваться</button>
    </form>
    <div class="auth-links"><a href="#" id="go-login">У меня уже есть аккаунт</a></div>`);
  bindForm(async (d) => {
    if (!d.agree) throw new Error('Нужно принять условия и дать согласие на обработку данных');
    if ((d.password || '').length < 8) throw new Error('Пароль должен быть не короче 8 символов');
    authState.email = d.email;
    await http('/api/auth/register', { method: 'POST', body: { email: d.email, password: d.password } });
    showVerify(d.email);
  });
  $('#go-login').onclick = (e) => { e.preventDefault(); showLogin(); };
}

function showVerify(email, msg) {
  authShell('Подтверди почту', `
    <p class="auth-note">${esc(msg || 'Мы отправили 6-значный код на')} <b>${esc(email)}</b>. Если письма нет, проверь «Спам».</p>
    <form id="auth-form" novalidate>
      <label class="f"><span>Код из письма</span><input id="v-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required class="code-input"></label>
      <p class="neg small" id="auth-err" hidden></p>
      <button type="submit" class="primary block">Подтвердить</button>
    </form>
    <div class="auth-links"><a href="#" id="resend">Отправить код ещё раз</a><a href="#" id="go-login">Назад</a></div>`);
  bindForm(async (d) => finishAuth(await http('/api/auth/verify', { method: 'POST', body: { email, code: d.code } }), email));
  $('#resend').onclick = async (e) => {
    e.preventDefault();
    try { await http('/api/auth/resend', { method: 'POST', body: { email } }); toast('Код отправлен ещё раз'); } catch (x) { toast(x.message); }
  };
  $('#go-login').onclick = (e) => { e.preventDefault(); showLogin(); };
}

function showForgot() {
  authShell('Сброс пароля', `
    <p class="auth-note">Пришлём код на почту, и ты задашь новый пароль.</p>
    <form id="auth-form" novalidate>
      <label class="f"><span>Почта</span><input id="f-email" name="email" type="email" autocomplete="email" required value="${esc(authState.email)}"></label>
      <p class="neg small" id="auth-err" hidden></p>
      <button type="submit" class="primary block">Прислать код</button>
    </form>
    <div class="auth-links"><a href="#" id="go-login">Назад ко входу</a></div>`);
  bindForm(async (d) => {
    authState.email = d.email;
    await http('/api/auth/forgot', { method: 'POST', body: { email: d.email } });
    showReset(d.email);
  });
  $('#go-login').onclick = (e) => { e.preventDefault(); showLogin(); };
}

function showReset(email) {
  authShell('Новый пароль', `
    <p class="auth-note">Если почта <b>${esc(email)}</b> зарегистрирована, на неё пришёл код.</p>
    <form id="auth-form" novalidate>
      <label class="f"><span>Код из письма</span><input id="p-code" name="code" inputmode="numeric" maxlength="6" required class="code-input"></label>
      <label class="f"><span>Новый пароль, от 8 символов</span><input id="p-pass" name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="neg small" id="auth-err" hidden></p>
      <button type="submit" class="primary block">Сохранить и войти</button>
    </form>
    <div class="auth-links"><a href="#" id="go-login">Назад ко входу</a></div>`);
  bindForm(async (d) => finishAuth(await http('/api/auth/reset', { method: 'POST', body: { email, code: d.code, password: d.password } }), email));
  $('#go-login').onclick = (e) => { e.preventDefault(); showLogin(); };
}

'use strict';
/* Запуск Marginly: вход → синхронизация → интерфейс. Аккаунт, тариф, плашки состояния. */

const PRICE_RUB = 499;
const LEGAL = { terms: '/legal/terms.html', privacy: '/legal/privacy.html' };
const BRAND_SVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#15171a"/><path d="M13 46V20l13 15 12-15v26" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/><path d="M42 33l9-11" stroke="#ffd21f" stroke-width="6" stroke-linecap="square"/><path d="M44 21h8v8" fill="none" stroke="#ffd21f" stroke-width="6" stroke-linecap="square"/></svg>';

let SESSION = null;

/* ── тема: по умолчанию как в системе, выбор хранится на устройстве ── */
const THEMES = [['system', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']];
function getTheme() { try { const t = localStorage.getItem('mg:theme'); return t === 'light' || t === 'dark' ? t : 'system'; } catch { return 'system'; } }
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function setTheme(t) {
  try { if (t === 'system') localStorage.removeItem('mg:theme'); else localStorage.setItem('mg:theme', t); } catch { /* приватный режим */ }
  applyTheme(t);
}
applyTheme(getTheme());

function themeSection() {
  const cur = getTheme();
  return `
    <div class="section"><h3>Оформление</h3><div class="card">
      <div class="seg" id="theme-seg">${THEMES.map(([k, t]) => `<button data-theme-set="${k}" class="${cur === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <p class="hint-line" style="margin:10px 0 0">«Как в системе» — тема меняется вместе с телефоном или компьютером. Выбор сохраняется на этом устройстве.</p>
    </div></div>`;
}
let SYNC_STATE = 'online';

const REJECT_TEXT = {
  trial_limit: 'В пробный период — 1 партия и до 10 товаров. Лишнее не сохранилось',
  subscription_required: 'Пробный период закончился — изменения не сохранились. Оформи подписку',
  too_large: 'Запись слишком большая и не сохранилась',
  bad_path: 'Часть данных не сохранилась',
};

const DEMO_PLAN = { status: 'demo', limits: { batches: 1, items: 10 }, can_write: true };

function planText(p) {
  if (!p) return 'Загружаю тариф…';
  if (p.status === 'demo') return 'Демо-режим: данные только на этом устройстве · 1 партия и до 10 товаров';
  if (p.status === 'active') return `Подписка активна до ${fmtDate(p.paid_until.slice(0, 10))}`;
  if (p.status === 'trial') {
    const left = Math.max(0, Math.ceil((new Date(p.trial_ends_at) - Date.now()) / 86400000));
    return `Пробный период: осталось ${left} ${plural(left, 'день', 'дня', 'дней')} · 1 партия и до 10 товаров`;
  }
  return 'Пробный период закончился — данные только для просмотра';
}

function renderBanner() {
  const el = $('#banner');
  if (!el) return;
  const p = S.plan;
  let html = '';
  if (p?.status === 'expired') {
    html = `<div class="banner bad">Пробный период закончился — можно только смотреть. <a href="#options">Оформить подписку — ${PRICE_RUB} ₽/мес</a></div>`;
  } else if (p?.status === 'trial') {
    const left = Math.ceil((new Date(p.trial_ends_at) - Date.now()) / 86400000);
    if (left <= 2) html = `<div class="banner">Пробный период закончится через ${left} ${plural(left, 'день', 'дня', 'дней')}. <a href="#options">Оформить подписку</a></div>`;
  }
  if (SYNC_STATE === 'offline') html += '<div class="banner muted">Нет связи с сервером — изменения сохранены на устройстве и отправятся позже</div>';
  el.innerHTML = html;
  el.hidden = !html;
}

function accountSection() {
  const p = S.plan;
  const pending = DB?.pendingCount?.() || 0;
  return `
    <div class="section"><h3>Аккаунт и тариф</h3><div class="card">
      <div class="calc">
        <span class="k">Почта</span><span class="v">${esc(S.email)}</span>
        <span class="k">Тариф</span><span class="v">${{ active: 'Подписка', trial: 'Пробный', demo: 'Демо' }[p?.status] || 'Закончился'}</span>
        ${p?.status === 'demo' ? '' : `<span class="k">Синхронизация</span><span class="v">${SYNC_STATE === 'offline' ? `<span class="neg">нет связи${pending ? `, ждут отправки: ${pending}` : ''}</span>` : '<span class="pos">всё сохранено</span>'}</span>`}
      </div>
      <p class="hint-line" style="margin:12px 0">${esc(planText(p))}</p>
      ${p?.status === 'demo' ? `<button class="primary" id="demo-exit">Зарегистрироваться</button>
        <p class="hint-line" style="margin-top:10px">После регистрации данные демо-режима не переносятся.</p>`
        : `${p?.status !== 'active' ? `<button class="primary" id="subscribe">Оформить подписку — ${PRICE_RUB} ₽/мес</button>` : ''}
      <div class="row" style="margin-top:14px">
        <button id="logout">Выйти</button>
        <span class="spacer"></span>
        <button class="ghost sm" id="del-acc">Удалить аккаунт</button>
      </div>`}
    </div></div>`;
}

function bindAccountSection() {
  $$('[data-theme-set]').forEach((b) => (b.onclick = () => {
    setTheme(b.dataset.themeSet);
    $$('[data-theme-set]').forEach((x) => x.classList.toggle('on', x === b));
  }));
  $('#demo-exit')?.addEventListener('click', () => { saveSession(null); sessionStorage.setItem('mg:msg', 'Зарегистрируйся, чтобы данные сохранялись на сервере'); location.reload(); });
  $('#subscribe')?.addEventListener('click', () => toast('Оплата подключается на следующем этапе'));
  $('#logout')?.addEventListener('click', guard(async () => {
    if (DB?.pendingCount?.() && !(await ask('Часть изменений ещё не отправлена на сервер. Если выйти сейчас, они пропадут.', 'Всё равно выйти'))) return;
    await logout();
  }));
  $('#del-acc')?.addEventListener('click', () => openSheet('Удалить аккаунт', `
    <p style="margin-top:0">Аккаунт, все партии, заказы и фото удалятся навсегда. Восстановить их будет нельзя.</p>
    <form id="da">
      <label class="f"><span>Пароль для подтверждения</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="danger block">Удалить навсегда</button>
    </form>`, (el) => {
    $('#da', el).onsubmit = guard(async (e) => {
      e.preventDefault();
      await http('/api/me', { method: 'DELETE', token: SESSION.token, body: { password: formData(e.target).password } });
      DB?.wipe?.();
      closeSheet();
      await logout('Аккаунт удалён');
    });
  }));
}

async function logout(msg) {
  if (SESSION) { try { await http('/api/auth/logout', { method: 'POST', token: SESSION.token }); } catch { /* офлайн — не страшно */ } }
  saveSession(null);
  if (msg) sessionStorage.setItem('mg:msg', msg);
  location.reload();
}

async function ensureDefaults() {
  if (!canWrite()) return;
  if (!S.categories.size) await ops.addDefaultCategories();
  if (!Object.keys(S.settings).length) await DB.doc('app/settings').set({ ...DEFAULTS });
}

async function refreshRate() {
  try {
    const r = await http('/api/rate');
    if (r?.rate > 0 && canWrite()) { if (await ops.setCbrRate(r.rate, r.date)) onStoreChange(); }
  } catch { /* без сети курс подтянется позже */ }
}

async function startApp(session, plan) {
  SESSION = session;
  S.email = session.demo ? 'демо-режим' : session.email;
  if (session.demo) {
    S.plan = DEMO_PLAN;
    document.body.classList.remove('auth-mode');
    DB = makeSyncDb({ email: 'demo', offline: true });
    ASSETS = null;
    connectStore(onStoreChange);
    await ensureDefaults();
    renderBanner();
    render();
    return;
  }
  try { S.plan = plan || JSON.parse(localStorage.getItem('mg:plan:' + session.email)) || null; } catch { S.plan = plan || null; }
  document.body.classList.remove('auth-mode');
  view.innerHTML = '<div class="empty"><b>Загружаю данные…</b></div>';
  DB = makeSyncDb({
    token: session.token,
    email: session.email,
    onPlan: (p) => { S.plan = p; try { localStorage.setItem('mg:plan:' + session.email, JSON.stringify(p)); } catch { /* */ } renderBanner(); },
    onRejected: (reasons) => toast(REJECT_TEXT[reasons[0]] || 'Часть изменений не сохранилась'),
    onStatus: (st) => { if (st !== SYNC_STATE) { SYNC_STATE = st; renderBanner(); } },
    onAuthLost: () => { saveSession(null); sessionStorage.setItem('mg:msg', 'Сессия закончилась. Войди заново'); location.reload(); },
  });
  ASSETS = makeRemoteAssets(session.token);
  connectStore(onStoreChange);
  if (DB.isEmpty()) await DB.syncNow(); else DB.syncNow();
  await ensureDefaults();
  renderBanner();
  render();
  refreshRate();
}

// Кнопка «Назад» на Android: сначала закрывает фото и окна, потом листает назад.
window.__onBack = () => {
  if (!$('#lightbox').hidden) { $('#lightbox').hidden = true; return true; }
  if (!$('#sheet').hidden) { closeSheet(); return true; }
  return false;
};

(function boot() {
  const s = loadSession();
  const msg = sessionStorage.getItem('mg:msg');
  sessionStorage.removeItem('mg:msg');
  try { const api = localStorage.getItem('mg:api'); if (api) API_BASE = api; } catch { /* */ }
  if (s?.token || s?.demo) startApp(s);
  else showLogin(msg);
})();

</script>
